<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="IBM Plex Sans, PingFang SC, Microsoft YaHei, sans-serif">
<style>
.box{fill:#fdfdfb;stroke:#181713;stroke-width:1.5;rx:8}
.t{font-size:13px;fill:#181713}
.s{font-size:11px;fill:#5f5c55}
.a{stroke:#4c50c4;stroke-width:2;fill:none;marker-end:url(#m)}
.h{font-size:14px;font-weight:600;fill:#181713}
</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4c50c4"/></marker></defs>
<rect width="760" height="300" fill="#f3f2ee"/>
<text class="h" x="20" y="28">载荷链（板 → 地面）</text>
<g>
<rect class="box" x="20" y="45" width="92" height="46"/><text class="t" x="66" y="66" text-anchor="middle">六孔板 + 盖</text><text class="s" x="66" y="82" text-anchor="middle">自由刚体</text>
<path class="a" d="M112 68h24"/>
<rect class="box" x="138" y="45" width="92" height="46"/><text class="t" x="184" y="66" text-anchor="middle">隔板</text><text class="s" x="184" y="82" text-anchor="middle">穿孔板 1.5 mm</text>
<path class="a" d="M230 68h24"/>
<rect class="box" x="256" y="45" width="92" height="46"/><text class="t" x="302" y="66" text-anchor="middle">L 形导轨</text><text class="s" x="302" y="82" text-anchor="middle">两侧，搭接面</text>
<path class="a" d="M348 68h24"/>
<rect class="box" x="374" y="45" width="92" height="46"/><text class="t" x="420" y="66" text-anchor="middle">立柱 ×4</text><text class="s" x="420" y="82" text-anchor="middle">槽孔挂接</text>
<path class="a" d="M466 68h24"/>
<rect class="box" x="492" y="45" width="92" height="46"/><text class="t" x="538" y="66" text-anchor="middle">内胆 / 箱体</text><text class="s" x="538" y="82" text-anchor="middle">焊接框架</text>
<path class="a" d="M584 68h24"/>
<rect class="box" x="610" y="45" width="60" height="46"/><text class="t" x="640" y="66" text-anchor="middle">调平脚</text><text class="s" x="640" y="82" text-anchor="middle">×4</text>
<path class="a" d="M670 68h24"/>
<text class="t" x="698" y="72">地面</text>
</g>
<text class="h" x="20" y="135">门</text>
<g>
<rect class="box" x="20" y="150" width="92" height="46"/><text class="t" x="66" y="171" text-anchor="middle">外门</text><text class="s" x="66" y="187" text-anchor="middle">保温门 60 mm</text>
<path class="a" d="M112 173h24"/>
<rect class="box" x="138" y="150" width="92" height="46"/><text class="t" x="184" y="171" text-anchor="middle">铰链 ×2</text><text class="s" x="184" y="187" text-anchor="middle">左侧，0–115°</text>
<path class="a" d="M230 173h24"/>
<rect class="box" x="256" y="150" width="92" height="46"/><text class="t" x="302" y="171" text-anchor="middle">前框</text><text class="s" x="302" y="187" text-anchor="middle">执行器驱动</text>
<path class="a" d="M348 173 Q500 173 525 92"/>
<rect class="box" x="20" y="215" width="92" height="46"/><text class="t" x="66" y="236" text-anchor="middle">内玻璃门</text><text class="s" x="66" y="252" text-anchor="middle">钢化玻璃 + 框</text>
<path class="a" d="M112 238h24"/>
<rect class="box" x="138" y="215" width="92" height="46"/><text class="t" x="184" y="236" text-anchor="middle">铰链 ×2</text><text class="s" x="184" y="252" text-anchor="middle">右侧，0–105°</text>
<path class="a" d="M230 238h24"/>
<rect class="box" x="256" y="215" width="92" height="46"/><text class="t" x="302" y="236" text-anchor="middle">内胆前框</text><text class="s" x="302" y="252" text-anchor="middle">执行器驱动</text>
<path class="a" d="M348 238 Q440 238 492 91" />
</g>
<text class="s" x="20" y="288">仿真中：箱体、立柱、导轨、隔板合为固定刚体，碰撞面取真实承托面；门由铰链关节加执行器驱动。板和盖不加 weld，也不加跟随约束。</text>
</svg>
