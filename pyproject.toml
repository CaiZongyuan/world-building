[project]
name = "world-building"
version = "0.1.0"
description = "建模到仿真流程的工具：验证门、项目目录"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sim = ["mujoco>=3.3"]

[project.scripts]
wb = "wb.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb"]
