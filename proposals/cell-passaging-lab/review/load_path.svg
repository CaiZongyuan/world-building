<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="sans-serif" font-size="13">
<style>.b{fill:#fdfdfb;stroke:#36342f;stroke-width:1.4}.t{fill:#181713}.a{stroke:#4c50c4;stroke-width:2;marker-end:url(#m)}.h{fill:#4c50c4;font-weight:600}</style>
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4c50c4"/></marker></defs>
<text class="h" x="20" y="30">板的载荷链</text>
<g transform="translate(20,45)"><rect class="b" width="120" height="36" rx="6"/><text class="t" x="60" y="23" text-anchor="middle">六孔板 + 盖</text>
<line class="a" x1="122" y1="18" x2="160" y2="18"/><rect class="b" x="162" width="130" height="36" rx="6"/><text class="t" x="227" y="23" text-anchor="middle">板位支撑块 ×4</text>
<line class="a" x1="294" y1="18" x2="332" y2="18"/><rect class="b" x="334" width="110" height="36" rx="6"/><text class="t" x="389" y="23" text-anchor="middle">台面</text>
<line class="a" x1="446" y1="18" x2="484" y2="18"/><rect class="b" x="486" width="150" height="36" rx="6"/><text class="t" x="561" y="23" text-anchor="middle">工作站机架 / 腿</text>
<line class="a" x1="638" y1="18" x2="676" y2="18"/><rect class="b" x="678" width="90" height="36" rx="6"/><text class="t" x="723" y="23" text-anchor="middle">地面</text></g>
<text class="h" x="20" y="125">管的载荷链</text>
<g transform="translate(20,140)"><rect class="b" width="120" height="36" rx="6"/><text class="t" x="60" y="23" text-anchor="middle">离心管 + 盖</text>
<line class="a" x1="122" y1="18" x2="160" y2="18"/><rect class="b" x="162" width="130" height="36" rx="6"/><text class="t" x="227" y="23" text-anchor="middle">适配器 / 管座柱</text>
<line class="a" x1="294" y1="18" x2="332" y2="18"/><rect class="b" x="334" width="110" height="36" rx="6"/><text class="t" x="389" y="23" text-anchor="middle">转子 / 开盖器</text>
<line class="a" x1="446" y1="18" x2="484" y2="18"/><rect class="b" x="486" width="150" height="36" rx="6"/><text class="t" x="561" y="23" text-anchor="middle">离心机机身 / 离心台</text>
<line class="a" x1="638" y1="18" x2="676" y2="18"/><rect class="b" x="678" width="90" height="36" rx="6"/><text class="t" x="723" y="23" text-anchor="middle">地面</text></g>
<text class="h" x="20" y="220">机器人的载荷链（底座固定在滑台上：IDEALIZED）</text>
<g transform="translate(20,235)"><rect class="b" width="120" height="36" rx="6"/><text class="t" x="60" y="23" text-anchor="middle">Panda + 载荷</text>
<line class="a" x1="122" y1="18" x2="160" y2="18"/><rect class="b" x="162" width="130" height="36" rx="6"/><text class="t" x="227" y="23" text-anchor="middle">立柱法兰</text>
<line class="a" x1="294" y1="18" x2="332" y2="18"/><rect class="b" x="334" width="110" height="36" rx="6"/><text class="t" x="389" y="23" text-anchor="middle">滑台</text>
<line class="a" x1="446" y1="18" x2="484" y2="18"/><rect class="b" x="486" width="150" height="36" rx="6"/><text class="t" x="561" y="23" text-anchor="middle">导轨（滑动副）</text>
<line class="a" x1="638" y1="18" x2="676" y2="18"/><rect class="b" x="678" width="90" height="36" rx="6"/><text class="t" x="723" y="23" text-anchor="middle">地面</text></g>
<text class="t" x="20" y="320">门：门板 → 铰链 → 设备机身 → 地面（培养箱、工作站两扇门、离心机盖；均由执行器驱动）</text>
</svg>
